<title>Je bent uitgenodigd voor Andy Apples!</title>
<!-- Uitnodigingslink voor online multiplayer (…/uitnodiging#join=lobby-id, zonder .html; de server vindt dit bestand dan zelf), gemaakt door mpInviteLink in js/mp-online.js.
     Deze pagina bestaat alleen voor de link-preview (Discord, WhatsApp, …): die ziet het stukje na # niet, dus een eigen
     pagina is de enige manier om uitnodigingen een eigen titel en afbeelding te geven. Spelers gaan meteen door naar het
     spel, met de lobbycode erbij. Afbeelding en adressen zijn volledige URL's; verhuist het spel, pas ze dan hier aan. -->
<meta name="description" content="Kom snel, de lobby staat klaar. Race tegen je vrienden door de jungle, tot 20 spelers tegelijk. Gratis in je browser.">
